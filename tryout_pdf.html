<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
<title>Tryout 보고서 출력 v1.14</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-dark:    #0f172a;
  --bg-card:    #1e293b;
  --bg-card-hi: #283447;
  --border:     #334155;
  --border-hi:  #475569;
  --text:       #e2e8f0;
  --text-mid:   #cbd5e1;
  --text-sub:   #94a3b8;
  --text-dim:   #64748b;
  --ice:        #7dd3fc;
  --orange:     #fdba74;
  --green:      #4ade80;
  --rose:       #fca5a5;
  --purple:     #c4b5fd;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  background: var(--bg-dark); color: var(--text); min-height: 100vh;
}

/* 화면(편집) 영역 */
.app-header {
  background: linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  background: rgba(125,211,252,0.1); color: var(--ice);
  border: 1px solid rgba(125,211,252,0.3);
  padding: 6px 12px; border-radius: 14px;
  font-size: 12px; font-weight: 600; text-decoration: none;
}
.app-header h1 { font-size: 18px; font-weight: 700; color: var(--ice); flex: 1; }
.ver { font-size: 11px; color: var(--text-sub); margin-left: 6px; }

.config-panel {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
.config-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.config-row label { font-size: 12px; color: var(--text-sub); font-weight: 600; min-width: 70px; }
.config-row input, .config-row textarea {
  flex: 1; min-width: 150px;
  background: var(--bg-dark); color: var(--text);
  border: 1px solid var(--border-hi); border-radius: 6px;
  padding: 7px 10px; font-size: 13px; font-family: inherit;
}
.config-row .check {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--text); font-size: 13px; cursor: pointer;
}
.config-row .check input { width: 16px; height: 16px; flex: none; min-width: 0; accent-color: var(--ice); }

.btn-row { display: flex; gap: 8px; padding: 10px 16px; }
.btn-row button {
  flex: 1; padding: 12px; border-radius: 8px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-print { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
.btn-back { background: var(--bg-card-hi); color: var(--text-mid); border: 1px solid var(--border-hi); }

.preview-wrap {
  background: var(--bg-dark); padding: 14px;
  overflow-x: auto;
}
.preview-hint {
  text-align: center; font-size: 12px; color: var(--text-sub); margin-bottom: 10px;
}

/* 보고서 본체 — 인쇄 시 그대로 출력됨 */
.report-page {
  background: white; color: #222;
  width: 210mm; min-height: 297mm;
  max-width: none;
  margin: 0 auto;
  padding: 18mm 16mm;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 11pt; line-height: 1.5;
}

/* 보고서 헤더 */
.r-head {
  border-bottom: 3px double #000;
  padding-bottom: 10px;
  margin-bottom: 14px;
  text-align: center;
  clear: both;
}
.r-head .company {
  font-size: 11pt; color: #555; margin-bottom: 4px; letter-spacing: 1px;
}
.r-head .title {
  font-size: 22pt; font-weight: 800; color: #000;
  margin-bottom: 6px; letter-spacing: 4pt;
}
.r-head .meta {
  display: flex; gap: 14px; font-size: 9pt; color: #666;
  justify-content: center;
}
.r-head .meta span { color: #222; font-weight: 600; }

/* 결재란 - 상단 우측 배치 */
.approval {
  width: 50%; margin: 0 0 14px auto;
  border-collapse: collapse;
  border: 1.5px solid #000;
}
.approval th, .approval td {
  border: 1px solid #000;
  text-align: center; vertical-align: middle;
}
.approval th {
  background: #f0f0f0; font-size: 9pt;
  padding: 4px 0; color: #000; font-weight: 700;
  height: 18pt;
}
.approval td {
  height: 50pt; min-width: 60px;
  font-size: 9pt; color: #888;
}

/* 정보 박스 */
.info-box {
  background: #f8f9fa; border-left: 4px solid #1a3a5c;
  padding: 8px 12px; margin-bottom: 14px;
  font-size: 10pt;
}
.info-box .lbl { color: #555; font-weight: 600; margin-right: 6px; }
.info-box .sec { margin: 3px 0; }

/* 요약 */
.summary-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 14px;
}
.summary-box {
  border: 1px solid #ccc; border-radius: 4px;
  padding: 8px; text-align: center;
}
.summary-box .num { font-size: 18pt; font-weight: 800; color: #1a3a5c; }
.summary-box .lbl { font-size: 8pt; color: #666; }

/* 섹션 제목 */
.r-section {
  background: #1a3a5c; color: white;
  padding: 5px 10px; font-size: 11pt; font-weight: 700;
  margin: 14px 0 8px 0; border-radius: 2px;
}

/* 상세 테이블 */
.log-table {
  width: 100%; border-collapse: collapse; font-size: 9pt;
  margin-bottom: 10px;
  table-layout: fixed;
}
.log-table th, .log-table td {
  border: 1px solid #ccc; padding: 5px 6px; vertical-align: top;
  text-align: left;
  word-break: keep-all; overflow-wrap: anywhere;
}
/* 짧은 컬럼들은 세로 가운데 정렬 (본문이 길어도 같이 안 위로 붙음) */
.log-table .c-date,
.log-table .c-mold,
.log-table .c-stage,
.log-table .c-status,
.log-table .c-iatf,
.log-table .c-author { vertical-align: middle; }
.log-table th {
  background: #1a3a5c; color: white;
  text-align: center; font-weight: 600;
}
.log-table .c-date  { width: 11%; text-align: center; }
.log-table .c-mold  { width: 12%; text-align: center; }
.log-table .c-stage { width: 7%; text-align: center; }
.log-table .c-status{ width: 9%; text-align: center; }
.log-table .c-body  { width: 47%; }
.log-table .c-iatf  { width: 7%; text-align: center; }
.log-table .c-author{ width: 7%; text-align: center; }
.log-table td .lbl { color: #666; font-weight: 600; }
.log-table td .sec { margin-bottom: 2px; }
.log-table .status-tag { font-size: 8pt; padding: 1px 6px; border-radius: 8px; font-weight: 700; display: inline-block; }
.log-table .status-tag.진행중  { background: #cfe2ff; color: #084298; }
.log-table .status-tag.완료    { background: #d1e7dd; color: #0a3622; }
.log-table .status-tag.보류    { background: #fff3cd; color: #664d03; }
.log-table .status-tag.문제발생 { background: #f8d7da; color: #58151c; }

/* IATF 후보 */
.iatf-list {
  border: 1px solid #c4b5fd; border-radius: 4px;
  padding: 8px 12px; background: #faf7ff; margin-bottom: 10px;
}
.iatf-list .it { font-size: 9pt; margin: 3px 0; }
.iatf-list .it .tag { font-weight: 700; color: #6f42c1; margin-right: 5px; }

/* 사진 표 (3칸) */
.photos-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 10px;
  table-layout: fixed;
}
.photos-table td {
  width: 33.333%;
  vertical-align: top;
  padding: 3px;
  page-break-inside: avoid;
  break-inside: avoid;
}
.photos-table .photo-box {
  width: 100%;
  padding-bottom: 100%;          /* 1:1 정사각 */
  position: relative;
  border: 1px solid #ccc;
  overflow: hidden;
  background: #f8f8f8;
}
.photos-table .photo-box img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.photos-table .photo-box .cap {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.55); color: white;
  font-size: 7pt; padding: 2px 3px; text-align: center;
}
/* 빈 셀 */
.photos-table td.empty .photo-box {
  border: 1px dashed #ddd;
  background: transparent;
}
.photos-table td.empty .photo-box::before { content: ''; }

/* 푸터 3칸 */
.r-footer {
  border-top: 1px solid #888; margin-top: 16px; padding-top: 6px;
  font-size: 8pt; color: #666;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
}
.r-footer .f-left   { text-align: left; }
.r-footer .f-center { text-align: center; }
.r-footer .f-right  { text-align: right; }

/* 토스트 */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(15,23,42,0.95); border: 1px solid var(--ice);
  color: var(--ice); padding: 10px 20px; border-radius: 20px;
  font-size: 13px; z-index: 9999;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* 인쇄 — A4 최적화 */
@page {
  size: A4 portrait;
  margin: 10mm;
}
@media print {
  body { background: white !important; }
  .app-header, .config-panel, .btn-row, .preview-hint, .toast { display: none !important; }
  .preview-wrap { background: white !important; padding: 0 !important; }
  .report-page {
    max-width: 100% !important; min-height: auto !important;
    margin: 0 !important; padding: 0 !important;
    box-shadow: none !important;
  }
  /* 색상 보존 */
  .r-section, .log-table th, .approval th, .info-box,
  .log-table .status-tag, .iatf-list {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  /* 페이지 나눔 제어 */
  .r-head, .approval, .info-box {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .log-table { page-break-inside: auto; }
  .log-table tr {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .log-table thead {
    display: table-header-group;  /* 페이지마다 헤더 반복 */
  }
  .r-section {
    page-break-after: avoid;
    break-after: avoid;
  }
  .photos-table tr {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .photos-table td {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .iatf-list .it {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  /* A4 페이지 설정 */
  @page {
    size: A4 portrait;
    margin: 12mm 14mm 14mm 14mm;  /* 상 우 하 좌 */
  }
}
</style>
</head>
<body>

<!-- 인증 가드 -->
<script>
(function(){
  'use strict';
  var s; try{ s = JSON.parse(localStorage.getItem('mm_user_session')||'null'); }catch(e){ s=null; }
  if(!s || !s.exp || s.exp <= Date.now()){
    location.replace('index.html'); document.documentElement.style.display='none';
    throw new Error('Unauthorized');
  }
  window.__msmSession = s;
})();
</script>

<div class="app-header">
  <a href="tryout_report.html" class="back-btn">‹ 작업일지</a>
  <h1>📄 Tryout 보고서 출력 <span class="ver" onclick="showVer()">v1.14</span></h1>
</div>

<div class="config-panel no-print">
  <div class="config-row">
    <label>보고서 제목</label>
    <input type="text" id="cfgTitle" value="Tryout 작업 보고서">
  </div>
  <div class="config-row">
    <label>보고서 번호</label>
    <input type="text" id="cfgDocNo" placeholder="자동 생성됨">
  </div>
  <div class="config-row">
    <label>회사명</label>
    <input type="text" id="cfgCompany" placeholder="(회사명)">
  </div>
  <div class="config-row">
    <label>비고</label>
    <input type="text" id="cfgMemo" placeholder="(선택)">
  </div>

  <details style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
    <summary style="cursor:pointer;font-size:12px;color:var(--purple);font-weight:700;padding:4px 0">📌 PDF 하단 푸터 (3칸)</summary>
    <div style="padding-top:8px">
      <div class="config-row">
        <label>왼쪽</label>
        <input type="text" id="cfgFooterLeft" placeholder="문서번호 (예: QM-TR-2026-001)">
      </div>
      <div class="config-row">
        <label>가운데</label>
        <input type="text" id="cfgFooterCenter" placeholder="회사명 (예: ㈜○○산업)">
      </div>
      <div class="config-row">
        <label>오른쪽</label>
        <input type="text" id="cfgFooterRight" placeholder="용지 크기 (예: A4 210×297)">
      </div>
      <button type="button" onclick="clearFooter()" style="background:transparent;color:var(--rose);border:1px solid var(--rose);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;width:100%;margin-top:4px">🗑 푸터 정보 지우기</button>
    </div>
  </details>

  <div class="config-row" style="margin-top:8px">
    <label class="check"><input type="checkbox" id="cfgPhotos" checked> 사진 포함</label>
    <label class="check"><input type="checkbox" id="cfgIatf" checked> IATF 후보 섹션</label>
    <label class="check"><input type="checkbox" id="cfgIssuesOnly"> 문제발생만</label>
  </div>
</div>

<div class="btn-row no-print" style="gap:6px">
  <button class="btn-back" type="button" onclick="location.href='tryout_report.html'" style="flex:0 0 30%">‹ 돌아가기</button>
  <button class="btn-print" type="button" onclick="downloadPDF()" style="flex:1;background:linear-gradient(135deg, #c4b5fd, #a78bfa);color:white">📥 PDF 다운로드</button>
  <button class="btn-print" type="button" onclick="renderAndPrint()" style="flex:0 0 30%">🖨 인쇄</button>
</div>

<div class="preview-wrap">
  <div class="preview-hint no-print">📱 모바일: 핀치 줌(두 손가락 확대/축소) + 좌우 스크롤 / 💻 PC: A4 그대로 표시 / 🖨 인쇄 시 양식 그대로 출력</div>
  <div class="report-page" id="reportBody">
    <div style="text-align:center;padding:40px;color:#999">데이터 로딩 중...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showVer(){
  alert(
    '📄 Tryout 보고서 출력 변경 이력\n' +
    '━━━━━━━━━━━━━━━━━━━━━━━━\n\n' +
    'v1.14 (현재)\n' +
    '• 짧은 셀(날짜/금형/차수/상태/IATF/작성자) 세로 가운데 정렬\n' +
    '  → 본문이 길어도 같이 위로 안 붙음\n\n' +
    'v1.13\n' +
    '• 사진 3칸 표 구조 확정 (보기 안정적)\n\n' +
    'v1.12\n' +
    '• 사진 영역: grid → table (3칸 표 구조)\n' +
    '  - 행(tr) 단위로 페이지 분할 — 사진이 잘리지 않음\n' +
    '  - 한 행이 페이지 끝에 안 들어가면 통째로 다음 페이지로\n' +
    '  - PDF 렌더링 안정성 대폭 향상\n\n' +
    'v1.11\n' +
    '• PDF 변환 정확도 개선\n' +
    '  - 모든 이미지 로드 완료 대기 후 캡처\n' +
    '  - 보고서 폭을 794px로 강제 + 리플로우\n' +
    '  - 모바일에서도 정확한 A4 레이아웃\n\n' +
    'v1.10\n' +
    '• 사진 그리드: 한 줄 4장 → 3장 (PDF에서 더 보기 좋음)\n' +
    '• aspect-ratio → padding-bottom 100% (호환성 개선)\n' +
    '• 페이지 분할 옵션 개선 (avoid-all → 특정 요소만)\n' +
    '  → 사진이 페이지 경계에서 잘리지 않게\n\n' +
    'v1.9\n' +
    '• PDF 다운로드 A4 정확 매핑\n' +
    '  - html2canvas windowWidth 강제 (794px = 210mm)\n' +
    '  - 모바일 화면 폭 무관하게 A4 비율 유지\n' +
    '  - jsPDF margin=0 (보고서 자체 padding 18mm 사용)\n' +
    '  - 변환 중 box-shadow 제거 (PDF 깔끔)\n\n' +
    'v1.8\n' +
    '• 📥 PDF 다운로드 버튼 추가 (html2pdf.js)\n' +
    '• 모바일에서도 PDF 파일로 저장 가능\n' +
    '• 파일명: 보고서번호_제목.pdf 자동 생성\n' +
    '• 버튼 3개: [돌아가기] / [PDF 다운로드] / [인쇄]\n\n' +
    'v1.7\n' +
    '• 결재란을 보고서 최상단 우측에 배치 (50% 너비)\n' +
    '• 제목을 가운데 정렬 + 자간 넓혀서 강조\n' +
    '• 미리보기 핀치 줌(확대/축소) 가능\n' +
    '• 모바일에서 PDF 전체 확인 용이\n\n' +
    'v1.6\n' +
    '• @page A4 명시적 선언 (인쇄 시 정확한 A4)\n' +
    '• 테이블 컬럼 비율 재조정 (작업/이슈 영역 47%로 확대)\n' +
    '• 한글 단어 줄바꿈 자동 처리 (글자 세로 떨어짐 방지)\n' +
    '• 미리보기 가로 스크롤 가능 (모바일 대응)\n' +
    '• A4 너비 210mm 강제 유지\n\n' +
    'v1.5\n' +
    '• A4 인쇄 품질 강화\n' +
    '• 테이블 행이 페이지 경계에서 잘리지 않게 처리\n' +
    '• 결재란/사진/IATF 영역도 페이지 나눔 제어\n' +
    '• 페이지마다 테이블 헤더 자동 반복\n' +
    '• 표준 A4 마진(상12 좌우14 하14mm) 적용\n\n' +
    'v1.4\n' +
    '• 보고서 번호: 출력일자 + 시각 기반 (TR-YYYYMMDD-HHMM)\n' +
    '• 회사명 placeholder를 (회사명)으로 단순화\n\n' +
    'v1.3\n' +
    '• 회사 독립화: 기본값(태진다이텍) 제거\n' +
    '• 회사명도 localStorage 저장 (한 번 입력 후 자동 복원)\n' +
    '• 푸터 표준 용도 명시: 좌=문서번호, 중=회사명, 우=용지크기\n' +
    '• 푸터 셋 다 비어있으면 푸터 영역 숨김\n\n' +
    'v1.2\n' +
    '• 푸터 우측 기본값: A4 (210×297)\n' +
    '• 푸터 placeholder 가이드 개선\n\n' +
    'v1.1\n' +
    '• PDF 하단 푸터 3칸 (좌/중/우) 추가\n' +
    '• 푸터 값 localStorage 자동 저장/복원\n' +

const SUPABASE_URL = 'https://xrmwfsuitikqibwqxede.supabase.co';

function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return String(n).padStart(2,'0'); }

let allLogs = [];
let filtered = [];
let filterState = {};

/* ============ 필터 상태 + 데이터 로드 ============ */
async function init(){
  try {
    filterState = JSON.parse(sessionStorage.getItem('tryout_pdf_filter') || '{}');
  } catch(e) { filterState = {}; }

  // 보고서 번호 자동 생성 (출력일자 + 시각)
  const now = new Date();
  const docNo = 'TR-' + now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate())
              + '-' + pad2(now.getHours()) + pad2(now.getMinutes());
  $('cfgDocNo').value = docNo;

  // 회사명 복원
  $('cfgCompany').value = localStorage.getItem(LS_FOOTER + 'company') || '';

async function loadLogs(){
  try {
    const { data, error } = await sb.from(TBL).select('*')
      .order('log_date', { ascending: true })
      .order('created_at', { ascending: true });
    if(error) throw error;
    allLogs = data || [];
  } catch(err){
    toast('데이터 로딩 실패');
    allLogs = [];
  }
}

function applyFilter(){
  const f = filterState;
  filtered = allLogs.filter(l => {
    if(f.status && l.status !== f.status) return false;
    if(f.stage && l.stage !== f.stage) return false;
    if(f.mold && l.mold_no !== f.mold) return false;
    if(f.from && (l.log_date||'') < f.from) return false;
    if(f.to && (l.log_date||'') > f.to) return false;
    if(f.iatf === 'fmea' && !l.fmea_flag) return false;
    if(f.iatf === 'cp' && !l.cp_flag) return false;
    if(f.iatf === 'any' && !(l.fmea_flag || l.cp_flag)) return false;
    if(f.kw){
      const blob = ((l.mold_no||'')+' '+(l.work_done||'')+' '+(l.author||'')+' '+(l.issues||'')).toLowerCase();
      if(!blob.includes(f.kw.toLowerCase())) return false;
    }
    if($('cfgIssuesOnly').checked && l.status !== '문제발생') return false;
    return true;
  });
}

/* ============ PDF 다운로드 (html2pdf.js) ============ */
window.downloadPDF = async function(){
  render();

  // 렌더 완료 대기
  await new Promise(r => setTimeout(r, 300));

  const el = document.getElementById('reportBody');
  if(!el){ alert('보고서 영역을 찾을 수 없습니다'); return; }
  if(typeof html2pdf === 'undefined'){
    alert('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  // 파일명
  const titleVal = ($('cfgTitle') && $('cfgTitle').value.trim()) || 'tryout_report';
  const docNoVal = ($('cfgDocNo') && $('cfgDocNo').value.trim()) || '';
  let fileName = (docNoVal ? docNoVal + '_' : '') + titleVal;
  fileName = fileName.replace(/[\/:*?"<>|]/g, '_') + '.pdf';

  // 로딩 토스트
  const overlay = document.createElement('div');
  overlay.textContent = '📥 PDF 생성 중...';
  overlay.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.95);border:1px solid #7dd3fc;color:#7dd3fc;padding:10px 20px;border-radius:20px;font-size:13px;z-index:99999;font-family:inherit';
  document.body.appendChild(overlay);

  // ─── 1. 모든 이미지 로드 완료까지 대기 ───
  overlay.textContent = '🖼️ 이미지 로딩 중...';
  const imgs = el.querySelectorAll('img');
  await Promise.all(Array.from(imgs).map(img => {
    if(img.complete && img.naturalHeight !== 0) return Promise.resolve();
    return new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
      // 안전장치 - 5초 후 무조건 진행
      setTimeout(resolve, 5000);
    });
  }));

  // ─── 2. report-page 폭을 px로 강제 (CSS의 210mm를 정확한 px로) ───
  // A4 portrait: 210mm × 297mm = 794px × 1123px (96 dpi)
  const A4_WIDTH_PX = 794;
  const origStyle = {
    width: el.style.width,
    minHeight: el.style.minHeight,
    maxWidth: el.style.maxWidth,
    boxShadow: el.style.boxShadow,
    margin: el.style.margin
  };
  el.style.width = A4_WIDTH_PX + 'px';
  el.style.maxWidth = A4_WIDTH_PX + 'px';
  el.style.minHeight = 'auto';
  el.style.boxShadow = 'none';
  el.style.margin = '0';

  // 강제 리플로우 - 브라우저가 새 폭으로 다시 그리도록
  void el.offsetWidth;
  await new Promise(r => setTimeout(r, 200));

  overlay.textContent = '📥 PDF 생성 중...';

  const opt = {
    margin:       0,
    filename:     fileName,
    image:        { type: 'jpeg', quality: 0.95 },
    html2canvas:  {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      scrollX: 0,
      scrollY: 0,
      windowWidth: A4_WIDTH_PX,
      width: A4_WIDTH_PX
    },
    jsPDF:        {
      unit: 'mm',
      format: 'a4',
      orientation: 'portrait',
      compress: true
    },
    pagebreak:    {
      mode: ['css', 'legacy'],
      avoid: ['.log-table tr', '.photos-table tr', '.iatf-list .it']
    }
  };

  // 원복 함수
  function restore(){
    el.style.width     = origStyle.width;
    el.style.maxWidth  = origStyle.maxWidth;
    el.style.minHeight = origStyle.minHeight;
    el.style.boxShadow = origStyle.boxShadow;
    el.style.margin    = origStyle.margin;
  }

  try {
    await html2pdf().set(opt).from(el).save();
    restore();
    overlay.textContent = '✓ PDF 저장 완료';
    overlay.style.color = '#4ade80';
    overlay.style.borderColor = '#4ade80';
    setTimeout(() => overlay.remove(), 1500);
  } catch(err){
    restore();
    overlay.remove();
    alert('PDF 생성 실패: ' + (err.message || err) + '\n\n인쇄 기능으로 시도해보세요.');
  }
};
