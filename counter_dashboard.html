<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설비 카운터</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#262d36;--ink:#e6edf3;--muted:#8b949e;--ok:#3fb950;--bad:#ef4444;--accent:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;font-size:14px}
  header{padding:14px 16px 6px;display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}.ver{color:var(--muted);font-size:12px}.clock{margin-left:auto;color:var(--muted);font-size:13px}
  .tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
  .tab{flex:1;background:none;border:none;color:var(--muted);padding:12px 4px;font-size:15px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-bottom-color:var(--ok);font-weight:700}
  .wrap{padding:12px 14px 50px;max-width:820px;margin:0 auto}
  .sub{color:var(--muted);font-size:13px;margin:2px 2px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{background:#21262d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn.go{background:var(--ok);color:#04130a;border-color:var(--ok);font-weight:700}
  .btn.x{padding:8px 10px;color:#f0883e}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .vals{display:flex;justify-content:space-between;text-align:center}
  .v .lab{color:var(--muted);font-size:12px}.v .num{font-size:26px;font-weight:700}
  .good{color:var(--ok)}.bd{color:var(--bad)}
  .meta{color:var(--muted);font-size:11px;margin-top:8px;display:flex;justify-content:space-between}
  .empty{color:var(--muted);text-align:center;padding:30px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 6px;text-align:left}
  thead th{color:var(--muted);border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid #1b2129}
  input,select{background:#0b0e13;border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 8px;font-size:13px;width:100%}
  .maprow td{padding:4px}
  .banner{background:#1d2a14;border:1px solid #3a5320;border-radius:8px;padding:8px 10px;color:#9fd86a;font-size:12px;margin-bottom:10px}
  .chip{display:inline-block;background:#21262d;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<header><h1>설비 카운터</h1><span class="ver">v1.0</span><span class="clock" id="clock">--:--:--</span></header>
<div class="tabs">
  <button class="tab active" id="tab-mon" onclick="showTab('mon')">현황</button>
  <button class="tab" id="tab-map" onclick="showTab('map')">매핑</button>
</div>
<div class="wrap">
  <section id="view-mon">
    <div class="sub"><span id="monInfo">불러오는 중…</span>
      <button class="btn" style="margin-left:auto" onclick="loadMon()">새로고침</button>
      <button class="btn go" onclick="zeroToday()">오늘 0부터(제로세팅)</button></div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="view-map" style="display:none">
    <div class="sub"><span>한 줄 = 한 카운터. MAC + GPIO → 어느 호기의 양품/불량인지 지정. (이 브라우저에 저장)</span></div>
    <div id="detected"></div>
    <div style="overflow:auto"><table>
      <thead><tr><th>MAC</th><th>GPIO</th><th>설비호기</th><th>종류</th><th></th></tr></thead>
      <tbody id="mapBody"></tbody></table></div>
    <div class="sub" style="margin-top:10px">
      <button class="btn" onclick="addRow()">+ 줄 추가</button>
      <button class="btn go" style="margin-left:auto" onclick="saveMap()">저장</button></div>
  </section>
  <footer>설비 카운터 (MAC+GPIO) · v1.0</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const SB="https://xrmwfsuitikqibwqxede.supabase.co";
const KEY="sb_publishable_0mgJ2cQeYpIDcfJi_9p4pA_dlaknATN";
const REST=SB.replace(/\/+$/,'').replace(/\/rest\/v1$/,'')+'/rest/v1/';
const SHOT="shot_count", BASE="daily_baseline";
const POLL=60000;
const GPIOS=[26,27,32,33];
const LS='mc_mapping_v1';
let mapping=[];

function H(){return {apikey:KEY,Authorization:'Bearer '+KEY};}
async function get(p){const r=await fetch(REST+p,{headers:H()});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600);}
function todayKST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function kstClock(){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());}
function relTime(s){if(!s)return'-';const a=(Date.now()-new Date(s).getTime())/1000;if(a<60)return'방금';if(a<3600)return Math.floor(a/60)+'분 전';if(a<86400)return Math.floor(a/3600)+'시간 전';return Math.floor(a/86400)+'일 전';}
function normMac(m){return (m||'').replace(/:/g,'').replace(/\s/g,'').toUpperCase();}
function codeOf(m){return normMac(m.mac)+'_'+m.gpio;}
function loadMap(){try{mapping=JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){mapping=[];}}

function showTab(t){
  document.getElementById('view-mon').style.display=t==='mon'?'':'none';
  document.getElementById('view-map').style.display=t==='map'?'':'none';
  document.getElementById('tab-mon').classList.toggle('active',t==='mon');
  document.getElementById('tab-map').classList.toggle('active',t==='map');
  if(t==='mon')loadMon();else renderMap();
}

/* ===== 현황 ===== */
async function latestOf(code){
  try{const r=await get(SHOT+'?machine_code=eq.'+encodeURIComponent(code)+'&select=shot_count,created_at&order=created_at.desc&limit=1');
    return r&&r[0]?{cum:+r[0].shot_count||0,ts:r[0].created_at}:{cum:0,ts:null};}
  catch(e){return {cum:0,ts:null};}
}
async function loadMon(){
  loadMap();
  const box=document.getElementById('cards');
  if(!mapping.length){box.innerHTML='<div class="empty">매핑이 없습니다. ‘매핑’ 탭에서 등록하세요.</div>';document.getElementById('monInfo').textContent='매핑 0줄';return;}
  try{
    const codes=[...new Set(mapping.map(codeOf))];
    const [lat, base]=await Promise.all([
      Promise.all(codes.map(c=>latestOf(c).then(v=>[c,v]))),
      get(BASE+'?baseline_date=eq.'+todayKST()+'&select=machine_code,baseline_count').catch(()=>[])
    ]);
    const L={};lat.forEach(([c,v])=>L[c]=v);
    const B={};(base||[]).forEach(r=>B[r.machine_code]=+r.baseline_count||0);
    const mc={};
    mapping.forEach(m=>{const c=codeOf(m);const cum=(L[c]||{}).cum||0;const today=Math.max(0,cum-(B[c]||0));
      const g=mc[m.machine]||(mc[m.machine]={good:0,bad:0,ts:null});
      if(m.type==='불량')g.bad+=today;else g.good+=today;
      const ts=(L[c]||{}).ts;if(ts&&(!g.ts||new Date(ts)>new Date(g.ts)))g.ts=ts;
    });
    const names=Object.keys(mc).sort();
    box.innerHTML=names.map(n=>{const g=mc[n];const tot=g.good+g.bad;const rate=tot?(g.bad/tot*100).toFixed(1):'0.0';
      return `<div class="card"><h3>${n}</h3>
        <div class="vals">
          <div class="v"><div class="lab">양품</div><div class="num good">${g.good.toLocaleString()}</div></div>
          <div class="v"><div class="lab">불량</div><div class="num bd">${g.bad.toLocaleString()}</div></div>
          <div class="v"><div class="lab">불량률</div><div class="num">${rate}<span style="font-size:13px">%</span></div></div>
        </div><div class="meta"><span>오늘 누적</span><span>${relTime(g.ts)}</span></div></div>`;}).join('');
    document.getElementById('monInfo').textContent=todayKST()+' · 호기 '+names.length+' · 갱신 '+kstClock();
  }catch(e){document.getElementById('monInfo').textContent='오류: '+e.message;}
}
async function zeroToday(){
  loadMap();
  if(!mapping.length){toast('매핑 먼저');return;}
  if(!confirm('오늘 카운트를 0부터 다시 셉니다. (현재 누적을 기준점으로 저장)'))return;
  try{
    const codes=[...new Set(mapping.map(codeOf))];
    const lat=await Promise.all(codes.map(c=>latestOf(c).then(v=>[c,v.cum])));
    const today=todayKST();
    const body=lat.map(([c,cum])=>({machine_code:c,baseline_date:today,baseline_count:cum,created_at:new Date().toISOString().replace('Z','+00:00')}));
    const r=await fetch(REST+BASE+'?on_conflict=machine_code,baseline_date',{method:'POST',
      headers:Object.assign(H(),{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());
    toast('제로세팅 완료');loadMon();
  }catch(e){toast('실패: '+e.message);}
}

/* ===== 매핑 ===== */
function renderMap(){
  loadMap();
  const tb=document.getElementById('mapBody');
  tb.innerHTML=mapping.length?mapping.map((m,i)=>rowHTML(m,i)).join(''):'';
  if(!mapping.length)addRow();
  showDetected();
}
function gpioOpts(sel){return GPIOS.map(g=>'<option value="'+g+'"'+(+sel===g?' selected':'')+'>'+g+'</option>').join('');}
function typeOpts(sel){return ['양품','불량'].map(t=>'<option'+(t===sel?' selected':'')+'>'+t+'</option>').join('');}
function rowHTML(m,i){
  return `<tr class="maprow" data-i="${i}">
    <td><input class="m-mac" value="${m.mac||''}" placeholder="90:70:.. 또는 9070.."></td>
    <td><select class="m-gpio">${gpioOpts(m.gpio)}</select></td>
    <td><input class="m-machine" value="${m.machine||''}" placeholder="3호기"></td>
    <td><select class="m-type">${typeOpts(m.type||'양품')}</select></td>
    <td><button class="btn x" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
}
function addRow(mac,gpio,machine,type){
  const tb=document.getElementById('mapBody');
  const tr=document.createElement('tr');tr.className='maprow';
  tr.innerHTML=`<td><input class="m-mac" value="${mac||''}" placeholder="90:70:.. 또는 9070.."></td>
    <td><select class="m-gpio">${gpioOpts(gpio||26)}</select></td>
    <td><input class="m-machine" value="${machine||''}" placeholder="3호기"></td>
    <td><select class="m-type">${typeOpts(type||'양품')}</select></td>
    <td><button class="btn x" onclick="this.closest('tr').remove()">✕</button></td>`;
  tb.appendChild(tr);
}
function saveMap(){
  const rows=[...document.querySelectorAll('#mapBody .maprow')].map(tr=>({
    mac:tr.querySelector('.m-mac').value.trim(),
    gpio:+tr.querySelector('.m-gpio').value,
    machine:tr.querySelector('.m-machine').value.trim(),
    type:tr.querySelector('.m-type').value
  })).filter(m=>m.mac&&m.machine);
  mapping=rows;localStorage.setItem(LS,JSON.stringify(rows));
  toast('저장됨 ('+rows.length+'줄)');showDetected();
}
async function showDetected(){
  const box=document.getElementById('detected');
  try{
    const rows=await get(SHOT+'?select=machine_code,created_at&order=created_at.desc&limit=400');
    const seen=[...new Set((rows||[]).map(r=>r.machine_code))];
    const mapped=new Set(mapping.map(codeOf));
    const unmapped=seen.filter(c=>!mapped.has(c));
    box.innerHTML=unmapped.length?'<div class="banner">감지된 미매핑 신호 — 눌러서 줄 추가: '
      +unmapped.map(c=>'<span class="chip" onclick="quickAdd(\''+c+'\')">'+c+'</span>').join('')+'</div>':'';
  }catch(e){box.innerHTML='';}
}
function quickAdd(code){
  const i=code.lastIndexOf('_');const mac=code.slice(0,i),gpio=+code.slice(i+1);
  addRow(mac,gpio,'','양품');toast('줄 추가됨 — 호기 입력 후 저장');
}

/* 시작 */
loadMap();
setInterval(()=>document.getElementById('clock').textContent=kstClock(),1000);
document.getElementById('clock').textContent=kstClock();
loadMon();
setInterval(loadMon,POLL);
</script>
</body>
</html>
