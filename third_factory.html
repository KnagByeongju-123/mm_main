<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3공장</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  margin: 0; padding: 0; background: #f0f4fa; min-height: 100vh; color: #1a2a44;
}
.header {
  position: relative; padding: 26px 16px 22px; text-align: center;
  background: linear-gradient(180deg, #ffffff 0%, #eaf2fc 100%);
  border-bottom: 1px solid #d6e2f2;
}
.back-btn {
  position: absolute; top: 16px; left: 12px;
  background: white; border: 1px solid #c7d8f5;
  color: #1d4ed8; padding: 6px 12px 6px 10px;
  border-radius: 9px; font-size: 13px; font-weight: 600;
  text-decoration: none; display: inline-flex; align-items: center; gap: 3px;
  box-shadow: 0 1px 2px rgba(30,58,138,0.06);
}
.back-btn:active { transform: scale(0.97); }
.header h1 {
  margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #1d4ed8, #2563eb 50%, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .sub {
  margin-top: 4px; font-size: 12px; color: #6e809e;
}
.container {
  padding: 24px 16px 40px; max-width: 720px; margin: 0 auto;
}
.placeholder {
  background: white; border: 1px dashed #b8cee8; border-radius: 16px;
  padding: 56px 20px; text-align: center;
  box-shadow: 0 1px 3px rgba(30,58,138,0.04);
}
.placeholder .ic {
  font-size: 56px; line-height: 1; margin-bottom: 14px;
}
.placeholder .ttl {
  font-size: 17px; font-weight: 700; color: #1a2a44; margin-bottom: 6px;
}
.placeholder .ds {
  font-size: 13px; color: #6e809e; line-height: 1.5;
}
.footer {
  text-align: center; margin-top: 24px;
  font-size: 11px; color: #8aa2c0;
}
</style>
</head>
<body>

<div class="header">
  <a href="index1.html" class="back-btn">‹ 메인</a>
  <h1>③ 3공장</h1>
  <div class="sub">생산 · 품질 · 설비</div>
</div>

<div class="container">
  <div class="placeholder">
    <div class="ic">🚧</div>
    <div class="ttl">준비 중입니다</div>
    <div class="ds">이 화면은 아직 개발 중입니다.<br>곧 만나실 수 있어요.</div>
  </div>
  <div class="footer">v1.0 · msm Smart Factory</div>
</div>

</body>
</html>
