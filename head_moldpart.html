<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>본사 - 금형부품 재고관리</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  margin: 0; padding: 0;
  background: linear-gradient(135deg, #1a3a5c 0%, #2c5282 100%);
  min-height: 100vh; color: #222;
}
.header {
  padding: 32px 20px 24px; text-align: center; color: white;
}
.header h1 {
  margin: 0 0 6px 0; font-size: 24px; font-weight: 700;
  letter-spacing: -0.5px;
}
.header h1 .ver {
  font-size: 12px; opacity: 0.7; margin-left: 8px; font-weight: 400;
  vertical-align: middle;
}
.header p {
  margin: 0; font-size: 13px; opacity: 0.85;
}

.container {
  background: #f5f7fa;
  border-radius: 24px 24px 0 0;
  min-height: calc(100vh - 110px);
  padding: 20px 16px 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 600px;
  margin: 0 auto 20px auto;
}

.card {
  background: white; border-radius: 16px; padding: 20px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: pointer; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: transform 0.1s, box-shadow 0.1s;
  text-align: center; min-height: 130px;
  text-decoration: none; color: inherit;
}
.card:active {
  transform: scale(0.97);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.card .icon {
  width: 56px; height: 56px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; color: white;
}
.card .label {
  font-size: 14px; font-weight: 600; line-height: 1.3;
  color: #222;
}
.card .desc {
  font-size: 11px; color: #888; line-height: 1.3;
}

.card.c1 .icon { background: linear-gradient(135deg, #28a745, #20c997); }
.card.c2 .icon { background: linear-gradient(135deg, #1a3a5c, #2c5282); }
.card.c3 .icon { background: linear-gradient(135deg, #fd7e14, #ff9a3c); }
.card.c4 .icon { background: linear-gradient(135deg, #6f42c1, #8b5cf6); }
.card.c5 .icon { background: linear-gradient(135deg, #dc3545, #e74c3c); }
.card.c6 .icon { background: linear-gradient(135deg, #17a2b8, #20c4d8); }

.card.coming-soon {
  background: #ebeef2; cursor: default;
}
.card.coming-soon:active { transform: none; }
.card.coming-soon .icon {
  background: #c5ccd6 !important; color: #8a93a0;
}
.card.coming-soon .label { color: #8a93a0; }
.card.coming-soon .desc { color: #aab2bd; }

.section-title {
  font-size: 12px; color: #888; font-weight: 600;
  margin: 8px 4px 10px 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}

.footer {
  text-align: center; margin-top: 30px;
  font-size: 11px; color: #aab2bd;
}

/* 사용자 표시 배지 */
.user-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 4px 10px; border-radius: 14px;
  font-size: 12px; margin-top: 8px; cursor: pointer;
}
.user-badge .ic { font-size: 13px; }
.user-badge.empty { opacity: 0.65; }

/* 뒤로가기 버튼 */
.back-btn {
  position: absolute; top: 18px; left: 16px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.25);
  color: white; padding: 6px 12px 6px 10px;
  border-radius: 16px; font-size: 12px;
  text-decoration: none; font-weight: 600;
  display: inline-flex; align-items: center; gap: 4px;
}
.back-btn:active { background: rgba(255,255,255,0.28); }
.header { position: relative; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">‹ 메인</a>
  <h1>🏢 본사 · 금형부품 재고관리 <span class="ver">v1.6</span></h1>
  <div class="user-badge empty" id="userBadge">
    <span class="ic">👤</span>
    <span id="userBadgeText">내 정보 등록</span>
  </div>
</div>

<div class="container">

  <div class="section-title">📦 재고 / 자재</div>
  <div class="grid">
    <a class="card c1" href="head_moldpart_input.html">
      <div class="icon">📦</div>
      <div class="label">재고관리</div>
      <div class="desc">소모품 입출고 / 재고 조회</div>
    </a>

    <a class="card c2" href="head_stock_QR.html">
      <div class="icon">🔳</div>
      <div class="label">위치 QR 생성</div>
      <div class="desc">랙별 QR 라벨 만들기</div>
    </a>
  </div>

  <div class="section-title">📋 보고 / 결재</div>
  <div class="grid">
    <a class="card c4" href="head_stock_report.html">
      <div class="icon">📄</div>
      <div class="label">보고서</div>
      <div class="desc">월보고/발주/폐기 PDF·Excel</div>
    </a>
  </div>

  <div class="footer">
    v1.6 · msm
  </div>
</div>

<script>
'use strict';
(function() {
  // PIN 인증 세션 키 (index.html에서 저장)
  const LK_AUTH = 'mm_user_session';
  // 다른 페이지(재고관리/보고서) 호환용 키
  const K_DEPT = 'msmUser_dept';
  const K_NAME = 'msmUser_name';

  function $(id){return document.getElementById(id)}

  function getSession(){
    try{return JSON.parse(localStorage.getItem(LK_AUTH)||'null')}catch(e){return null}
  }

  /* 세션 정보를 다른 페이지(stock_mold/stock_report) 호환 키에 자동 미러링 */
  function mirrorToLegacyKeys(s){
    if(!s) return;
    if(s.role === 'admin'){
      localStorage.setItem(K_NAME, '관리자');
      localStorage.setItem(K_DEPT, '');
    }else{
      localStorage.setItem(K_NAME, s.name || '');
      localStorage.setItem(K_DEPT, s.dept || '');
    }
  }

  function refreshBadge(s){
    const badge = $('userBadge');
    const text = $('userBadgeText');
    if(!s){
      badge.classList.add('empty');
      text.textContent = '로그인 필요';
      return;
    }
    badge.classList.remove('empty');
    if(s.role === 'admin'){
      text.textContent = '관리자';
      badge.style.color = '#dc3545';
    }else{
      let label = s.name || '';
      if(s.factory) label = s.factory + ' · ' + label;
      if(s.dept)    label += ' · ' + s.dept;
      if(s.position) label += ' ' + s.position;
      text.textContent = label;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const s = getSession();

    // 1) 미인증 또는 세션 만료 → 메인으로 강제 이동
    if(!s || !s.exp || s.exp <= Date.now()){
      try{localStorage.removeItem(LK_AUTH)}catch(e){}
      location.replace('index.html');
      return;
    }

    // 2) 세션을 호환 키에 미러링 (다른 페이지 자동 채움용)
    mirrorToLegacyKeys(s);

    // 3) 상단 배지 표시
    refreshBadge(s);

    // 4) 배지 클릭 시 세션 정보 안내
    $('userBadge').addEventListener('click', () => {
      const expDate = new Date(s.exp);
      const remainDays = Math.max(0, Math.ceil((s.exp - Date.now())/(24*60*60*1000)));
      alert(
        '👤 ' + (s.role === 'admin' ? '관리자' : (s.name || '-')) + '\n' +
        (s.factory ? '🏭 공장: ' + s.factory + '\n' : '') +
        (s.dept    ? '📂 부서: ' + s.dept + '\n' : '') +
        (s.position? '🎖 직위: ' + s.position + '\n' : '') +
        '\n⏱ 자동 잠금까지: ' + remainDays + '일'
      );
    });
  });
})();
</script>

</body>
</html>
